<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Finance dashboard POC: online sales by brand and factory, production, marketing and cash safes.">
<title>Business Finance Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail (modules, Online sales has 4 sub-sections) + top bar (period, quick add) + content.
   Online sales = landing of 4 mini-dashboards → each opens a full section dashboard (widgets → charts → ledger).
   Ledger-house palette: green-grey paper neutrals, copper accent, semantic in/out/warn kept separate. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#f5f7f6; --ink:#14201c; --muted:#5a6a64; --line:#dce3df; --line-2:#c9d3ce;
  --accent:#a24f28; --accent-ink:#ffffff; --accent-soft:#f5e4da;
  --in:#1b7a4e; --in-soft:#ddf0e5; --out:#ad3537; --out-soft:#f7e1e1; --warn:#946010; --warn-soft:#f5ead2;
  --c1:#2f6f9f; --c2:#b0602e; --c3:#5a8a36; --c4:#8a4f9e; --c5:#a8831a; --c6:#2f8a85;
  --shadow:0 1px 2px rgb(20 32 28 / .06), 0 6px 20px rgb(20 32 28 / .05);
  --f-display:'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --f-body:'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1211; --surface:#141b19; --surface-2:#1a2321; --ink:#e4ebe8; --muted:#8c9b95; --line:#24302c; --line-2:#33413c;
  --accent:#e38c5b; --accent-ink:#1b0f08; --accent-soft:#38231a;
  --in:#52c58d; --in-soft:#153024; --out:#ef7272; --out-soft:#3a1c1d; --warn:#e0ac55; --warn-soft:#342914;
  --c1:#6aa8d6; --c2:#e38c5b; --c3:#8fc164; --c4:#c28ad4; --c5:#dcb84c; --c6:#5cc3bc;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0d1211; --surface:#141b19; --surface-2:#1a2321; --ink:#e4ebe8; --muted:#8c9b95; --line:#24302c; --line-2:#33413c;
  --accent:#e38c5b; --accent-ink:#1b0f08; --accent-soft:#38231a;
  --in:#52c58d; --in-soft:#153024; --out:#ef7272; --out-soft:#3a1c1d; --warn:#e0ac55; --warn-soft:#342914;
  --c1:#6aa8d6; --c2:#e38c5b; --c3:#8fc164; --c4:#c28ad4; --c5:#dcb84c; --c6:#5cc3bc;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 6px 20px rgb(0 0 0 / .25); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:14px/1.5 var(--f-body); margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num,.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em}
.ar{font-family:var(--f-body); color:var(--muted); font-weight:400; letter-spacing:0}

/* shell */
.app{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%}
.side{background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh; overflow:auto}
.mark{display:flex; align-items:center; gap:10px; padding:0 8px}
.mark b{font-family:var(--f-display); font-size:17px; font-weight:700}
.mark .logo{width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--f-display); font-weight:700}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-h{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:0 10px 6px}
.nav a{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; text-decoration:none; color:var(--muted); font-weight:500}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a.on{background:var(--accent-soft); color:var(--ink)}
.nav a.on svg{color:var(--accent)}
.nav a.sub{padding:6px 10px 6px 38px; font-size:13px; font-weight:400; position:relative}
.nav a.sub::before{content:""; position:absolute; left:19px; top:0; bottom:0; border-left:1px solid var(--line-2)}
.nav a.sub.on{background:none; color:var(--accent); font-weight:600}
.nav a.sub.on::before{border-left:2px solid var(--accent)}
.nav a .badge{margin-left:auto}
.nav svg{width:18px; height:18px; flex:none}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:6px}
.side-foot button{display:flex; align-items:center; gap:10px; padding:8px 10px; border:0; background:none; border-radius:8px; color:var(--muted); cursor:pointer; text-align:left}
.side-foot button:hover{background:var(--surface-2); color:var(--ink)}
.side-foot svg{width:16px;height:16px}

.main{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 28px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.crumb{display:flex; flex-direction:column; min-width:0; margin-right:auto}
.crumb small{color:var(--muted); font-size:12px}
.crumb small a{color:inherit; text-decoration:none}
.crumb small a:hover{color:var(--accent)}
.crumb h1{font-size:20px}
.content{padding:24px 28px 48px; display:flex; flex-direction:column; gap:18px; max-width:1320px; width:100%}

/* controls */
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--surface); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; white-space:nowrap; text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none; border-color:transparent}
.btn.sm{padding:5px 10px; font-size:13px}
.btn svg{width:16px; height:16px}
select.sel{border:1px solid var(--line-2); background:var(--surface); padding:8px 30px 8px 12px; border-radius:8px; cursor:pointer}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.chip{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface); padding:6px 12px; border-radius:999px; cursor:pointer; font-weight:500; color:var(--muted)}
.chip:hover{color:var(--ink); border-color:var(--line-2)}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.add{border-style:dashed}
.grp{display:inline-flex; align-items:center; gap:4px; padding:3px 4px 3px 10px; border:1px solid var(--line); border-radius:999px; background:var(--surface-2)}
.grp > span{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-right:4px}
.grp .chip{padding:4px 10px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--dc, var(--muted)); display:inline-block; flex:none}
.badge{font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--out-soft); color:var(--out)}
.badge.w{background:var(--warn-soft); color:var(--warn)}
.toolbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.toolbar .sp{margin-left:auto}

/* sales sub-navigation */
.subnav{display:flex; gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow-x:auto; width:max-content; max-width:100%}
.subnav a{display:flex; gap:8px; align-items:baseline; padding:7px 14px; border-radius:8px; text-decoration:none; color:var(--muted); font-weight:500; white-space:nowrap}
.subnav a:hover{color:var(--ink); background:var(--surface-2)}
.subnav a.on{background:var(--ink); color:var(--bg)}
.subnav a.on .ar{color:inherit; opacity:.75}
.subnav .ar{font-size:12px}

/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; min-width:0}
.panel-h{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.panel-h h2{font-size:15px}
.panel-h .sp{margin-left:auto}
.panel-note{color:var(--muted); font-size:12px; margin:8px 0 0}
.grid{display:grid; gap:16px}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}

/* KPIs and widgets */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
.kpi{position:relative; display:flex; flex-direction:column; gap:4px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px 12px; box-shadow:var(--shadow); transition:transform .15s, border-color .15s}
.kpi:hover{transform:translateY(-2px); border-color:var(--accent)}
.kpi-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.kpi-label{font-weight:600}
.kpi-val{font-family:var(--f-display); font-size:28px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.2}
.kpi-val small, .big small, .w-val small{font-size:12px; color:var(--muted); font-weight:500; margin-right:4px; font-family:var(--f-body); letter-spacing:0}
.kpi-sub{color:var(--muted); font-size:12.5px}
svg.spark{width:100%; height:38px; margin-top:6px; display:block}
.kpi .go{position:absolute; right:14px; bottom:12px; font-size:12px; color:var(--accent); font-weight:600; opacity:0; transition:opacity .15s}
.kpi:hover .go{opacity:1}

.six{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.w{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 10px; display:flex; flex-direction:column; gap:2px; min-width:0}
.w-h{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px}
.w-h .n{font-family:var(--f-mono); font-size:11px; color:var(--muted); border:1px solid var(--line-2); border-radius:5px; padding:0 5px; font-weight:500}
.w-h .ar{font-size:12px; margin-left:auto}
.w-val{font-family:var(--f-display); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.w-sub{font-size:12px; color:var(--muted)}
.w.key{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}

/* landing tiles */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.tile{display:flex; flex-direction:column; gap:12px; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px 16px; box-shadow:var(--shadow); transition:border-color .15s, transform .15s; min-width:0}
.tile:hover{border-color:var(--accent); transform:translateY(-2px)}
.tile-h{display:flex; align-items:center; gap:12px}
.tile-h .ico{width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; flex:none}
.tile-h .ico svg{width:20px; height:20px}
.tile-h h2{font-size:18px}
.tile-h .ar{font-size:13px}
.tile .big{font-family:var(--f-display); font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em; line-height:1.15}
.tile-f{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:10px; margin-top:auto; font-size:12.5px; color:var(--muted)}
.tile-f b{color:var(--accent)}
.minirows{display:flex; flex-direction:column; gap:6px}

/* summary strip */
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.strip > div{padding:14px 18px; border-right:1px solid var(--line); min-width:0}
.strip > div:last-child{border-right:0}
.strip .lbl{font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:baseline; flex-wrap:wrap}
.strip .big{font-family:var(--f-display); font-size:21px; font-weight:600; font-variant-numeric:tabular-nums}
.strip .hint{font-size:11.5px; color:var(--muted)}
.strip .key{background:var(--surface-2)}
.t-in{color:var(--in)} .t-out{color:var(--out)} .t-warn{color:var(--warn)} .t-acc{color:var(--accent)}

/* hero figure (statement debt) */
.hero{display:grid; grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.hero > div{padding:18px 20px; border-right:1px solid var(--line); min-width:0}
.hero > div:last-child{border-right:0}
.hero .debt{background:var(--out-soft)}
.hero .debt .big{font-size:34px; color:var(--out)}
.hero .big{font-family:var(--f-display); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.hero .lbl{font-size:12.5px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:baseline}
.hero .debt .lbl{color:var(--out)}
.hero .hint{font-size:12px; color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:left; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r, th.r{text-align:right}
td.num{white-space:nowrap}
tr.bf td{background:var(--surface-2); color:var(--muted); font-style:italic}
tr.miss td{color:var(--muted)}
tfoot td{font-weight:600; background:var(--surface-2); border-top:1px solid var(--line-2); border-bottom:0}
.muted{color:var(--muted)}
.cellname{display:flex; align-items:center; gap:8px; white-space:nowrap}
.sub{display:block; color:var(--muted); font-size:12px}
.empty{padding:36px; text-align:center; color:var(--muted); border:1px dashed var(--line-2); border-radius:var(--r)}
.link{background:none; border:0; color:var(--accent); cursor:pointer; font-weight:600; padding:0; text-decoration:none; font-size:13px}
.icon-btn{background:none; border:0; color:var(--muted); cursor:pointer; padding:4px; border-radius:6px; line-height:0}
.icon-btn:hover{color:var(--out); background:var(--out-soft)}
.icon-btn svg{width:15px; height:15px}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.p-in{background:var(--in-soft); color:var(--in)}
.p-warn{background:var(--warn-soft); color:var(--warn)}
.p-mute{background:var(--surface-2); color:var(--muted)}
.p-out{background:var(--out-soft); color:var(--out)}
.tag{font-size:11.5px; padding:2px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); white-space:nowrap}

/* charts */
svg text{fill:var(--muted); font:11px var(--f-mono)}
svg .vt{fill:var(--ink); font-weight:500}
.chart{width:100%; display:block}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.hbar{display:grid; grid-template-columns:minmax(80px,130px) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:13px; padding:5px 0}
.hbar .track{height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; display:flex}
.hbar .fill{height:100%; border-radius:6px}
.hbar .num{text-align:right; font-size:12.5px}
.donut-wrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.donut-wrap svg{width:150px; height:150px; flex:none}
.donut-legend{display:flex; flex-direction:column; gap:7px; font-size:13px; flex:1; min-width:140px}
.donut-legend div{display:flex; align-items:center; gap:8px}
.donut-legend .num{margin-left:auto}

/* today list */
.today{display:flex; flex-direction:column; gap:8px}
.today-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; padding:10px 12px; border-radius:8px; background:var(--surface-2); align-items:center}
.today-row .vals{grid-column:1/-1; display:flex; gap:14px; font-size:12.5px; color:var(--muted)}
.today-row .vals b{color:var(--ink); font-family:var(--f-mono); font-weight:500}

/* quick-entry bar */
.quick{display:grid; grid-template-columns:150px 160px 140px minmax(0,1fr) auto; gap:8px; align-items:end; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.quick.inv{grid-template-columns:150px 160px 130px 140px minmax(0,1fr) auto}
.quick .fld label{font-size:12px; font-weight:600}
.quick .fld input, .quick .fld select{border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:8px 10px; width:100%}
.quick .qh{grid-column:1/-1; display:flex; gap:8px; align-items:baseline; font-size:12.5px; color:var(--muted)}
.quick .qh b{color:var(--ink); font-size:14px}
.search{border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:7px 11px; min-width:0; width:220px; max-width:100%}

/* attention */
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; gap:12px; padding:10px 12px; border-radius:8px; background:var(--surface-2); border:0; border-left:3px solid var(--sev, var(--muted)); cursor:pointer; text-align:left; width:100%}
.alert:hover{filter:brightness(.98)}
.alert b{display:block; font-weight:600}
.alert span{font-size:12.5px; color:var(--muted)}

/* safes */
.safe{display:flex; flex-direction:column; gap:14px; cursor:pointer; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:20px; position:relative}
.safe.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.safe .big{font-family:var(--f-display); font-size:32px; font-weight:600; font-variant-numeric:tabular-nums}
.safe-h{display:flex; align-items:center; gap:10px}
.safe-h svg{width:22px; height:22px; color:var(--accent)}
.rule{font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--line); padding-top:12px}
.meter{height:6px; background:var(--surface-2); border-radius:6px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--in)}
.meter.low i{background:var(--out)}
.io{display:flex; gap:18px; font-size:13px; flex-wrap:wrap}

/* dialog */
dialog{border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink); padding:0; width:min(560px, calc(100vw - 32px)); box-shadow:0 24px 60px rgb(0 0 0 / .25)}
dialog::backdrop{background:rgb(10 16 14 / .45)}
.dlg-h{padding:18px 22px 4px; display:flex; align-items:baseline; gap:10px}
.dlg-h h2{font-size:18px}
form.f{padding:12px 22px 20px; display:grid; grid-template-columns:1fr 1fr; gap:14px}
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld.full, .full{grid-column:1/-1}
.fld label, .fld .lab{font-size:12.5px; font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:9px 11px; width:100%}
.fld .hint{font-size:12px; color:var(--muted)}
.fld .warnhint{font-size:12px; color:var(--warn)}
.seg{display:flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.seg label{flex:1; position:relative; text-align:center; padding:8px 6px; cursor:pointer; font-weight:500; font-size:13px; border-right:1px solid var(--line-2)}
.seg label:last-child{border-right:0}
.seg input{position:absolute; opacity:0; pointer-events:none}
.seg label:has(input:checked){background:var(--ink); color:var(--bg)}
.seg label:has(input:disabled){color:var(--muted); cursor:not-allowed; text-decoration:line-through; opacity:.6}
.seg label:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:-2px}
.f-actions{grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px; padding-top:4px}
.f-err{grid-column:1/-1; background:var(--out-soft); color:var(--out); padding:8px 12px; border-radius:8px; font-size:13px}
.sheet td{padding:6px 8px}
.sheet input{width:100%; min-width:80px; border:1px solid var(--line-2); background:var(--surface); border-radius:6px; padding:7px 8px; text-align:right; font-family:var(--f-mono)}
.choose{padding:12px 22px 22px; display:grid; grid-template-columns:1fr 1fr; gap:8px}
.choose h3{grid-column:1/-1; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:var(--f-body); font-weight:600; margin-top:6px}
.choose button{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); cursor:pointer}
.choose button:hover{border-color:var(--accent)}
.choose button b{font-weight:600}
.choose button span{font-size:12px; color:var(--muted)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; z-index:50; box-shadow:var(--shadow); display:flex; gap:14px; align-items:center}
.toast button{background:none; border:0; color:var(--accent); font-weight:700; cursor:pointer; padding:0}
.sample{font-size:11.5px; color:var(--warn); background:var(--warn-soft); padding:3px 9px; border-radius:6px; font-weight:600}
.row-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .g-2-1{grid-template-columns:minmax(0,1fr)}
  .six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:repeat(2,minmax(0,1fr))} .hero .debt{grid-column:1/-1}
  .quick, .quick.inv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static; height:auto; flex-direction:row; align-items:center; padding:10px 16px; gap:12px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line)}
  .side .nav-h, .side-foot span, .mark b, .nav a.sub{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap; padding:8px 10px}
  .side-foot{margin:0 0 0 auto; flex-direction:row}
  .top{padding:10px 16px}
  .content{padding:16px 16px 40px}
  .g-2, .g-1-1, .tiles{grid-template-columns:minmax(0,1fr)}
  .strip > div{border-right:0; border-bottom:1px solid var(--line)}
}
@media (max-width:520px){
  .kpis, .six, .hero{grid-template-columns:minmax(0,1fr)}
  .hero > div{border-right:0; border-bottom:1px solid var(--line)}
  form.f, .choose, .quick, .quick.inv{grid-template-columns:1fr}
  .nav a span.lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="mark"><span class="logo">F</span><b>Finance Hub</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button type="button" data-act="theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Theme</span></button>
      <button type="button" data-act="reset" title="Reset sample data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Reset sample data</span></button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb"><small id="crumb-sub"></small><h1 id="crumb-title"></h1></div>
      <span class="sample" title="All figures are generated examples for this proof of concept">Sample data</span>
      <label for="period" class="muted" style="font-size:12px">Period</label>
      <select id="period" class="sel">
        <option value="today">Today</option>
        <option value="month">This month</option>
        <option value="3m">Last 3 months</option>
        <option value="ytd">This year</option>
        <option value="all">All time</option>
      </select>
      <button class="btn primary" type="button" data-act="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>New entry</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>

<script>
/* ============ constants & rules ============ */
const MAIN_ALLOWED = ['Rent','Salaries','Commissions','Factory payments','Raw materials','Utilities','Taxes & insurance','Loan installments','Owner withdrawal','Transfer to office safe'];
const OFFICE_ALLOWED = ['Supermarket','Transport','Cleaning','Hospitality','Stationery','Maintenance','Courier','Other petty cash'];
const PROD_EXP = ['Raw materials','Salaries','Rent','Utilities','Maintenance','Transport','Cleaning','Stationery','Hospitality','Equipment','Other petty cash'];
const PROD_IN = ['Storage fees','Printing jobs','Course fees','Other income'];
const CHANNELS = ['Facebook & Instagram ads','TikTok ads','Google ads','Influencers','Flyers & printing'];
const SAFE_IN = ['Owner deposit','Other income'];
const PAY_METHODS = ['Cash','Bank transfer','InstaPay'];
const SAFE_NAMES = {main:['Main safe','الخزنة الرئيسية'], office:['Office safe','خزنة المكتب'], bank:['Bank / card','بنك']};
const isTransfer = t => t.category === 'Transfer to office safe' || t.category === 'Transfer from main safe';
const mktCategory = ch => ch === 'Influencers' ? 'Commissions' : ch;
/* The one rule both safes enforce: what each safe may pay for. */
function allowedFrom(safe, category){
  if (safe === 'main') return MAIN_ALLOWED.includes(category);
  if (safe === 'office') return OFFICE_ALLOWED.includes(category);
  return true;
}

/* ============ dates & format ============ */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const TODAY_S = iso(TODAY);
const nf = new Intl.NumberFormat('en-US', {maximumFractionDigits:0});
const fmt = n => nf.format(Math.round(n));
const fmtK = n => Math.abs(n) >= 1e6 ? (n/1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : Math.abs(n) >= 1000 ? fmt(n/1000) + 'k' : fmt(n);
const fmtDate = s => parse(s).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
const fmtDay = s => parse(s).toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'short'});
const monLabel = d => d.toLocaleDateString('en-GB', {month:'short'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a, f = x => x.amount) => a.reduce((s,x) => s + (+f(x) || 0), 0);
const byDate = (a,b) => a.date.localeCompare(b.date);
const money = n => `<small>EGP</small>${fmt(n)}`;
const amt = (n, cls='') => n ? `<span class="num ${cls}">${fmt(n)}</span>` : '<span class="muted">—</span>';
const pct = (a,b) => b ? (a/b*100).toFixed(1) + '%' : '—';
const lastDays = n => { const a = []; for (let k = n-1; k >= 0; k--) a.push(addDays(TODAY_S, -k)); return a; };
const byDay = (list, val = x => x.amount) => { const m = new Map(); for (const x of list) m.set(x.date, (m.get(x.date) || 0) + (+val(x) || 0)); return m; };

/* ============ sample data ============ */
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seed(){
  const R = mulberry32(20261008);
  const rnd = (a,b) => Math.round(a + R()*(b-a));
  const pick = a => a[Math.floor(R()*a.length)];
  let n = 0; const id = p => p + (++n).toString(36);
  const months = []; for (let k = 5; k >= 0; k--) months.push(new Date(TODAY.getFullYear(), TODAY.getMonth()-k, 1));
  const dayIn = (m, lo=1, hi=31) => {
    const last = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    const cap = (m.getMonth() === TODAY.getMonth() && m.getFullYear() === TODAY.getFullYear()) ? TODAY.getDate() : last;
    const top = Math.max(1, Math.min(hi, cap)), bot = Math.min(lo, top);
    return iso(new Date(m.getFullYear(), m.getMonth(), rnd(bot, top)));
  };
  const factories = [
    {id:'f1', name:'Blanc', ar:'مصنع بلانك'},
    {id:'f2', name:'Fourteen', ar:'مصنع فورتين'},
    {id:'f3', name:'OneOSeven', ar:'مصنع وان أو سفن'},
  ];
  const brands = [
    {id:'b1', name:'Blanc', code:'BL', factoryId:'f1', color:0},
    {id:'b2', name:'Lady Blanc', code:'LB', factoryId:'f1', color:3},
    {id:'b3', name:'Fourteen', code:'FT', factoryId:'f2', color:1},
    {id:'b4', name:'OneOSeven', code:'OS', factoryId:'f3', color:2},
  ];
  const scale = {b1:1, b2:.55, b3:.8, b4:.7};
  const payBand = {f1:[115,130], f2:[58,68], f3:[50,60]};
  const sections = [
    {id:'s1', name:'Warehouses', ar:'المخازن', inCat:'Storage fees', exp:['Rent','Utilities','Maintenance','Cleaning'], items:['Cartons','Packaging rolls','Finished goods']},
    {id:'s2', name:'Printing', ar:'الطباعة', inCat:'Printing jobs', exp:['Raw materials','Maintenance','Equipment'], items:['Printed bags','Labels','Brochures']},
    {id:'s3', name:'Course', ar:'الكورس', inCat:'Course fees', exp:['Rent','Hospitality','Stationery'], items:['Course kits','Workbooks']},
    {id:'s4', name:'Others', ar:'أخرى', inCat:'Other income', exp:['Transport','Other petty cash','Utilities'], items:['Samples','Spare parts']},
  ];
  const txns = [], stock = [], daily = [], invoices = [], flyers = [], moves = [];
  const T = o => { const t = {id:id('t'), ...o}; txns.push(t); return t; };

  /* Online sales, day by day */
  const days = []; for (let d = new Date(months[0]); d <= TODAY; d.setDate(d.getDate()+1)) days.push(iso(d));
  const debt = {f1:0, f2:0, f3:0}, acc = {}, dn = {}, inv = {};
  brands.forEach(b => { const a = Math.round(scale[b.id]*150)*1000; dn[b.id] = 100; inv[b.id] = 1000;
    stock.push({id:id('s'), factoryId:b.factoryId, brandId:b.id, date:days[0], amount:a, ref:`DN-${b.code}-${++dn[b.id]}`, note:'Opening delivery'}); debt[b.factoryId] += a; });
  days.forEach((day, di) => {
    const dow = parse(day).getDay(), boost = (dow === 4 || dow === 5) ? 1.25 : 1;
    brands.forEach((b, bi) => {
      if (di > 0 && (di + bi*3) % 10 === 0){
        const a = Math.round(scale[b.id]*rnd(62,80))*1000;
        stock.push({id:id('s'), factoryId:b.factoryId, brandId:b.id, date:day, amount:a, ref:`DN-${b.code}-${++dn[b.id]}`, note:'Stock delivery'}); debt[b.factoryId] += a;
      }
      if (day === TODAY_S && bi >= 2) return; // today's numbers not entered yet for two brands
      const sold = Math.round(scale[b.id]*boost*rnd(4500,10000)/10)*10;
      const returned = Math.round(sold*rnd(3,14)/1000)*10;
      const shipping = Math.round(scale[b.id]*rnd(25,110))*10;
      daily.push({id:id('d'), date:day, brandId:b.id, sold, returned, shipping});
      acc[b.id] = (acc[b.id] || 0) + sold - returned;
      if ((di + bi) % 3 === 2){
        const a = Math.round(acc[b.id]*.97/100)*100; acc[b.id] = 0;
        if (a > 0) T({module:'sales', kind:'collection', dir:'in', brandId:b.id, date:day, amount:a, category:'Sales collection', safe:'main', desc:'Collected from shipping co.'});
      }
      if (R() < .55) invoices.push({id:id('i'), date:day, brandId:b.id, no:`${b.code}-${++inv[b.id]}`, amount:rnd(10,80)*100, note:pick(['Fabric','Packaging','Accessories','Labels','Hangers','Tailoring'])});
    });
    if (di % 14 === 7) for (const f of factories){
      const [lo, hi] = payBand[f.id]; const a = Math.min(debt[f.id], rnd(lo, hi)*1000);
      if (a > 0){ T({module:'sales', kind:'factory-pay', dir:'out', factoryId:f.id, date:day, amount:a, category:'Factory payments', safe:'main', method:pick(PAY_METHODS), desc:'Payment to factory'}); debt[f.id] -= a; }
    }
  });
  for (const m of months) for (const b of brands) for (let k = rnd(1,3); k > 0; k--)
    flyers.push({id:id('y'), date:dayIn(m), brandId:b.id, amount:rnd(8,30)*100, qty:rnd(5,30)*100, note:'Order inserts'});

  /* Production */
  for (const s of sections){
    for (const m of months){
      for (const c of s.exp){
        if (R() < .35) continue;
        const safe = MAIN_ALLOWED.includes(c) ? 'main' : OFFICE_ALLOWED.includes(c) ? 'office' : 'bank';
        const amount = safe === 'office' ? rnd(2,14)*100 : rnd(3,8)*1000 + rnd(0,9)*100;
        T({module:'production', dir:'out', sectionId:s.id, date:dayIn(m), amount, category:c, safe, desc:`${c} — ${s.name.toLowerCase()}`, receipt: safe === 'office' ? R() > .2 : undefined});
      }
      for (let k = 0; k < 2; k++) T({module:'production', dir:'in', sectionId:s.id, date:dayIn(m), amount:rnd(3,11)*1000, category:s.inCat, safe:'main', desc:s.inCat});
      for (let k = 0; k < 2; k++){
        moves.push({id:id('m'), sectionId:s.id, dir:'in', date:dayIn(m), item:pick(s.items), qty:rnd(10,60)*10});
        moves.push({id:id('m'), sectionId:s.id, dir:'out', date:dayIn(m), item:pick(s.items), qty:rnd(8,50)*10});
      }
    }
  }
  /* Marketing */
  for (const m of months){
    for (const ch of CHANNELS){
      if (R() < .2) continue;
      const cat = mktCategory(ch);
      T({module:'marketing', dir:'out', channel:ch, date:dayIn(m), amount:rnd(15,110)*100, category:cat, safe: cat === 'Commissions' ? 'main' : 'bank', desc: ch === 'Influencers' ? 'Influencer campaign' : 'Ad spend'});
    }
    if (R() < .4) T({module:'marketing', dir:'in', channel:pick(CHANNELS.slice(0,3)), date:dayIn(m), amount:rnd(5,25)*100, category:'Ad credit refund', safe:'bank', desc:'Unused ad credit refunded'});
  }
  /* Safes: direct entries + transfers */
  for (const m of months){
    T({module:'safe', dir:'out', date:dayIn(m,1,5), amount:15000, category:'Rent', safe:'main', desc:'Office & warehouse rent'});
    T({module:'safe', dir:'out', date:dayIn(m,25,28), amount:rnd(33,37)*1000, category:'Salaries', safe:'main', desc:'Monthly payroll'});
    T({module:'safe', dir:'out', date:dayIn(m), amount:rnd(30,70)*100, category:'Commissions', safe:'main', desc:'Sales team commissions'});
    T({module:'safe', dir:'out', date:dayIn(m), amount:rnd(18,35)*100, category:'Utilities', safe:'main', desc:'Electricity, water, internet'});
    const td = dayIn(m,1,6);
    T({module:'safe', dir:'out', date:td, amount:8000, category:'Transfer to office safe', safe:'main', desc:'Top-up office safe'});
    T({module:'safe', dir:'in', date:td, amount:8000, category:'Transfer from main safe', safe:'office', desc:'Top-up from main safe'});
    for (const [c, k, lo, hi] of [['Supermarket',3,15,70],['Transport',2,5,30],['Cleaning',1,10,25],['Hospitality',1,5,20],['Courier',1,5,15]])
      for (let i = 0; i < k; i++) T({module:'safe', dir:'out', date:dayIn(m), amount:rnd(lo,hi)*10, category:c, safe:'office', desc:c === 'Supermarket' ? 'Supermarket receipt' : c, receipt:R() > .15});
  }
  return {v:2, factories, brands, sections, txns, stock, daily, invoices, flyers, moves,
    safes:{main:{opening:180000, allowedOut:MAIN_ALLOWED}, office:{opening:3000, low:2500, allowedOut:OFFICE_ALLOWED}}};
}

/* ============ storage (per-viewer, optional) ============ */
const KEY = 'finance-hub-poc-v2', UIKEY = 'finance-hub-ui-v2';
function load(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch {} }
function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify(UI)); } catch {} }
let DB = load(KEY) || seed();
const UI = Object.assign({period:'month', brand:'all', factory:'f1', invQ:'', section:'all', prodTab:'expenses', mktFlow:'all', safe:'main', qDate:TODAY_S}, load(UIKEY) || {});
UI.qDate = TODAY_S;
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

/* ============ period & queries ============ */
function periodStart(){
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  return {today:TODAY_S, month:iso(new Date(y,m,1)), '3m':iso(new Date(y,m-2,1)), ytd:iso(new Date(y,0,1)), all:'0000-00-00'}[UI.period];
}
const PERIOD_LABEL = {today:'Today', month:'This month', '3m':'Last 3 months', ytd:'This year', all:'All time'};
const inP = x => x.date >= periodStart() && x.date <= TODAY_S;
const brand = id => DB.brands.find(b => b.id === id);
const factory = id => DB.factories.find(f => f.id === id);
const section = id => DB.sections.find(s => s.id === id);
const brandsOf = fid => DB.brands.filter(b => b.factoryId === fid);
const bColor = b => `var(--c${(b.color % 6) + 1})`;
const brandDot = b => b ? `<i class="dot" style="--dc:${bColor(b)}"></i>` : '';
const brandName = b => b ? `<span class="cellname">${brandDot(b)}${esc(b.name)}</span>` : '';
const lastMonths = () => { const a = []; for (let k = 5; k >= 0; k--) a.push(new Date(TODAY.getFullYear(), TODAY.getMonth()-k, 1)); return a; };
function monthly(list, f = x => x.amount){
  return lastMonths().map(m => { const k = iso(m).slice(0,7); return sum(list.filter(x => x.date.slice(0,7) === k), f); });
}
const collections = () => DB.txns.filter(t => t.kind === 'collection');
const factoryPays = () => DB.txns.filter(t => t.kind === 'factory-pay');
function safeBalance(s){ const o = DB.safes[s].opening; return o + sum(DB.txns.filter(t => t.safe === s && t.date <= TODAY_S), t => t.dir === 'in' ? t.amount : -t.amount); }
function factoryDebt(fid, upto = TODAY_S){
  return sum(DB.stock.filter(s => s.factoryId === fid && s.date <= upto)) - sum(factoryPays().filter(t => t.factoryId === fid && t.date <= upto));
}
const totalDebt = () => sum(DB.factories, f => factoryDebt(f.id));
/* Six figures per brand. Stock on hand = stock received − sold + returned (all time, to today). */
function brandStats(bid){
  const f = x => bid === 'all' || x.brandId === bid;
  const daily = DB.daily.filter(d => f(d) && d.date <= TODAY_S), dP = daily.filter(inP);
  const stock = DB.stock.filter(s => f(s) && s.date <= TODAY_S);
  const sold = sum(dP, d => d.sold), returned = sum(dP, d => d.returned), shipping = sum(dP, d => d.shipping);
  const stockIn = sum(stock.filter(inP));
  const flyers = sum(DB.flyers.filter(x => f(x) && inP(x)));
  const collected = sum(collections().filter(t => f(t) && inP(t)));
  const onHand = sum(stock) - sum(daily, d => d.sold) + sum(daily, d => d.returned);
  return {stockIn, sold, returned, shipping, flyers, collected, onHand, openHand: onHand - stockIn + sold - returned, net: sold - returned, rate: sold ? returned/sold : 0};
}
const enteredToday = () => DB.brands.filter(b => DB.daily.some(d => d.date === TODAY_S && d.brandId === b.id));

/* ============ icons ============ */
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  sales:'<path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  production:'<path d="M3 21V10l6 4V10l6 4V6l6 4v11z"/>',
  marketing:'<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
  safes:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5V7M15.5 12H17"/>',
  brands:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  collections:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/>',
  invoices:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h7"/>',
  statement:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
};
const svgI = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${ICON[k]}</svg>`;

/* ============ small renderers & charts ============ */
function table(cols, rows, empty = 'No entries in this period.', foot = ''){
  if (!rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r._cls||''}">${cols.map(c => `<td class="${c.cls||''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody>${foot}</table></div>`;
}

    {l:'+ Returned', v:s.returned, t:'up'}, {l:'On hand', v:s.onHand, t:'total'}];
  const W = 680, H = 230, L = 10, B = 26, T = 22; let run = 0; const bars = [];
  for (const st of steps){ if (st.t === 'total'){ bars.push({...st, a:0, b:st.v}); run = st.v; } else { bars.push({...st, a:run, b:run + st.v}); run += st.v; } }
  const max = niceMax(Math.max(...bars.map(b => Math.max(b.a, b.b)), 1)), min = Math.min(0, ...bars.map(b => Math.min(b.a, b.b)));
  const ih = H - B - T, y = v => T + ih - (v - min)/(max - min)*ih, cw = (W - L) / bars.length, bw = cw*.56;

  bars.forEach((b,i) => {
    const x = L + cw*i + (cw-bw)/2, top = y(Math.max(b.a,b.b)), h = Math.max(1, Math.abs(y(b.a) - y(b.b)));
    const col = b.t === 'total' ? 'var(--c1)' : b.t === 'up' ? 'var(--in)' : 'var(--out)';
    g += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}" ${b.t === 'total' ? '' : 'opacity=".85"'}/>`;
    if (i < bars.length-1) g += `<line x1="${(x+bw).toFixed(1)}" x2="${(x+cw).toFixed(1)}" y1="${y(b.b).toFixed(1)}" y2="${y(b.b).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
    g += `<text x="${(x+bw/2).toFixed(1)}" y="${(top-6).toFixed(1)}" text-anchor="middle" class="vt">${fmtK(b.t === 'total' ? b.v : Math.abs(b.v))}</text>`;

  const hi = DB.brands.map(b => ({b, s:brandStats(b.id)})).filter(x => x.s.sold && x.s.rate > .1).sort((x,y) => y.s.rate - x.s.rate)[0];
  if (hi) a.push({sev:'var(--out)', t:`${hi.b.name} returns at ${(hi.s.rate*100).toFixed(1)}%`, s:`EGP ${fmt(hi.s.returned)} returned ${PERIOD_LABEL[UI.period].toLowerCase()}`, go:'sales-brands', set:{brand:hi.b.id}});
  if (office < DB.safes.office.low) a.push({sev:'var(--warn)', t:'Office safe is running low', s:`EGP ${fmt(office)} left, below the EGP ${fmt(DB.safes.office.low)} alert`, go:'safes', set:{safe:'office'}});

  const top = DB.factories.map(f => ({f, d:factoryDebt(f.id)})).sort((x,y) => y.d - x.d)[0];

  return a;
}

function whereOf(t){
  if (t.module === 'sales') return t.kind === 'collection' ? `Collection · ${brand(t.brandId)?.name || ''}` : `Factory payment · ${factory(t.factoryId)?.name || ''}`;
  if (t.module === 'production') return `Production · ${section(t.sectionId)?.name || ''}`;
  if (t.module === 'marketing') return `Marketing · ${t.channel}`;
  return SAFE_NAMES[t.safe]?.[0] || 'Safe';
}

  const tabs = [['expenses','Expenses','المصروفات'],['collections','Collections','التحصيل'],['moves','Stock in / out','وارد وصادر']];

function viewSafes(){
  const s = UI.safe;
  const card = k => {
    const bal = safeBalance(k), cfg = DB.safes[k], t = DB.txns.filter(x => x.safe === k && inP(x));
    const low = k === 'office' && bal < cfg.low;

      <div class="safe-h">${svgI('safes')}<div><h3 style="font-size:16px">${SAFE_NAMES[k][0]}</h3><span class="ar">${SAFE_NAMES[k][1]}</span></div>${low ? '<span class="pill p-out" style="margin-left:auto">Low</span>' : ''}</div>
      <div class="big">${money(bal)}</div>
      ${k === 'office' ? `<div class="meter ${low ? 'low' : ''}" title="Against an 8,000 monthly top-up"><i style="width:${Math.max(2, Math.min(100, bal/8000*100))}%"></i></div>` : ''}
      <div class="io"><span>In <b class="num t-in">${fmt(sum(t.filter(x => x.dir === 'in')))}</b></span><span>Out <b class="num t-out">${fmt(sum(t.filter(x => x.dir === 'out')))}</b></span><span class="muted">${PERIOD_LABEL[UI.period]}</span></div>
      <div class="rule"><span>${k === 'main' ? `Pays for <b>${cfg.allowedOut.length} approved categories only</b> · receives all sales collections` : 'Petty cash for daily receipts'}</span>
        <div class="chips">${cfg.allowedOut.map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div></div>
    </button>`;
  };
  const ev = DB.txns.filter(t => t.safe === s).sort(byDate);
  const start = periodStart(); let bal = DB.safes[s].opening, bf = bal; const rows = [];
  for (const t of ev){ if (t.date > TODAY_S) continue; bal += t.dir === 'in' ? t.amount : -t.amount; if (t.date < start) bf = bal; else rows.push({...t, bal}); }
  rows.reverse();
  return `<section class="grid g-2">${card('main')}${card('office')}</section>
    <div class="panel">
      <div class="panel-h"><h2>${SAFE_NAMES[s][0]} ledger</h2><span class="ar">حركة ${SAFE_NAMES[s][1]}</span>

      <p class="muted" style="margin:-4px 0 12px; font-size:12.5px">Every entry that names this safe lands here automatically: sales collections, factory payments, production, marketing and direct entries. Newest first.</p>
      ${table([
        {h:'Date', f:t => `<span class="mono">${fmtDate(t.date)}</span>`},
        {h:'Entry', f:t => `${esc(t.desc || t.category)}<span class="sub">${esc(t.category)} · ${esc(whereOf(t))}</span>`},
        ...(s === 'office' ? [{h:'Receipt', f:t => t.dir === 'out' ? (t.receipt === false ? '<span class="pill p-warn">Missing</span>' : '<span class="pill p-in">Attached</span>') : ''}] : []),
        {h:'In', cls:'r', f:t => t.dir === 'in' ? amt(t.amount, 't-in') : ''},
        {h:'Out', cls:'r', f:t => t.dir === 'out' ? amt(t.amount, 't-out') : ''},
        {h:'Balance', cls:'r', f:t => `<span class="num">${fmt(t.bal)}</span>`},
      ], rows.slice(0, 400), 'No movements in this period.', `<tfoot><tr><td colspan="${s === 'office' ? 5 : 4}">Opening for the period: ${fmt(bf)} · Closing</td><td class="r num">${fmt(bal)}</td></tr></tfoot>`)}
    </div>`;
}

function openForm(key){
  const def = FORMS[key](); const v = {...def.init}; let err = '';
  const draw = () => {
    const fields = def.fields(v);
    for (const f of fields) if (f.type === 'seg' && f.options.find(o => o.v === v[f.k])?.disabled) v[f.k] = f.options.find(o => !o.disabled)?.v;
    dlg.innerHTML = `<div class="dlg-h"><h2>${def.title}</h2><span class="ar">${def.ar || ''}</span></div>
    <form class="f" id="frm" novalidate>${err ? `<div class="f-err" role="alert">${esc(err)}</div>` : ''}${fields.map(f => fieldHTML(f, v)).join('')}
      <div class="f-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="button" data-submit>Save</button></div></form>`;
    const frm = dlg.querySelector('#frm');
    frm.addEventListener('change', e => {
      const f = fields.find(x => x.k === e.target.name); if (!f) return;
      v[f.k] = f.type === 'file' ? (e.target.files[0]?.name || '') : e.target.value;
      if (f.rerender){ err = ''; draw(); }
    });
    frm.addEventListener('input', e => { const f = fields.find(x => x.k === e.target.name); if (f && f.type !== 'file' && f.type !== 'seg') v[f.k] = e.target.value; });
    frm.addEventListener('submit', e => {
      e.preventDefault();
      err = (NEEDS_AMOUNT(key) && !(+v.amount > 0)) ? 'Enter an amount above zero.' : ('date' in v && !v.date) ? 'Pick a date.' : (def.validate?.(v) || '');
      const sf = fields.find(f => f.k === 'safe' && f.type === 'seg');
      if (!err && sf && sf.options.find(o => o.v === v.safe)?.disabled) err = 'That safe cannot pay for this category.';
      if (err) return draw();
      const msg = def.submit(v);
      if (v.brandId && UI.brand !== 'all' && UI.brand !== v.brandId) UI.brand = v.brandId; // keep the new entry visible
      save(); saveUI(); dlg.close(); toast(msg); render();
    });
    dlg.querySelector('[data-close]').onclick = () => dlg.close();
    frm.querySelector('input:not([type=radio]):not([type=file]), select')?.focus();
  };
  draw(); if (!dlg.open) dlg.showModal();
}
function fieldHTML(f, v){
  const id = `f-${f.k}`, full = f.full ? ' full' : '';
  const hint = (f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '') + (f.warn ? `<span class="warnhint">${esc(f.warn)}</span>` : '');
  if (f.type === 'note') return `<p class="fld full hint muted" style="margin:0; font-size:12.5px">${f.html}</p>`;
  if (f.type === 'seg') return `<div class="fld${full}"><span class="lab" id="${id}-l">${f.label}</span><div class="seg" role="radiogroup" aria-labelledby="${id}-l">${f.options.map(o => `<label><input type="radio" id="${id}-${o.v}" name="${f.k}" value="${o.v}" ${v[f.k] === o.v ? 'checked' : ''} ${o.disabled ? 'disabled' : ''}>${esc(o.l)}</label>`).join('')}</div>${hint}</div>`;
  if (f.type === 'select') return `<div class="fld${full}"><label for="${id}">${f.label}</label><select id="${id}" name="${f.k}">${f.options.map(o => `<option value="${esc(o.v)}" ${String(v[f.k]) === String(o.v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>${hint}</div>`;
  if (f.type === 'file') return `<div class="fld${full}"><label for="${id}">${f.label}</label><input id="${id}" name="${f.k}" type="file" accept="image/*">${hint || '<span class="hint">Optional in this demo. In the MVP the photo is stored with the entry.</span>'}</div>`;
  const type = f.type === 'number' ? 'number" inputmode="decimal" min="0" step="any' : f.type;
  return `<div class="fld${full}"><label for="${id}">${f.label}</label><input id="${id}" name="${f.k}" type="${type}" value="${esc(v[f.k] ?? '')}" ${f.ph ? `placeholder="${esc(f.ph)}"` : ''}>${hint}</div>`;
}

function openSheet(date = TODAY_S){
  let d = date, err = '';
  const draw = () => {
    dlg.innerHTML = `<div class="dlg-h"><h2>Daily sheet</h2><span class="ar">يومية البراندات</span></div>
    <form class="f" id="frm" novalidate>${err ? `<div class="f-err" role="alert">${esc(err)}</div>` : ''}
      <div class="fld full"><label for="s-date">Day</label><input type="date" id="s-date" value="${d}" max="${TODAY_S}">
        <span class="hint">Sold is deducted from the brand's stock; returns go back into it. Leave a row empty to skip that brand.</span></div>
      <div class="full tbl-wrap"><table class="sheet"><thead><tr><th>Brand</th><th class="r">Sold</th><th class="r">Returned</th><th class="r">Shipping</th></tr></thead><tbody>
      ${DB.brands.map(b => { const e = DB.daily.find(x => x.date === d && x.brandId === b.id); return `<tr><td>${brandName(b)}</td>${['sold','returned','shipping'].map(k => `<td><input type="number" min="0" step="any" inputmode="decimal" id="s-${b.id}-${k}" aria-label="${esc(b.name)} ${k}" value="${e ? e[k] : ''}" placeholder="0"></td>`).join('')}</tr>`; }).join('')}
      </tbody></table></div>
      <div class="f-actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary" type="button" data-submit>Save day</button></div></form>`;
    dlg.querySelector('#s-date').onchange = e => { d = e.target.value || TODAY_S; err = ''; draw(); };
    dlg.querySelector('[data-close]').onclick = () => dlg.close();
    dlg.querySelector('#frm').onsubmit = e => {
      e.preventDefault();
      const rows = DB.brands.map(b => { const g = k => dlg.querySelector(`#s-${b.id}-${k}`).value; return {b, sold:g('sold'), returned:g('returned'), shipping:g('shipping')}; });
      if (rows.some(r => [r.sold, r.returned, r.shipping].some(x => x !== '' && +x < 0))) { err = 'Numbers can\'t be negative.'; return draw(); }
      let n = 0;
      for (const r of rows){
        const i = DB.daily.findIndex(x => x.date === d && x.brandId === r.b.id);
        if (r.sold === '' && r.returned === '' && r.shipping === ''){ if (i >= 0) DB.daily.splice(i, 1); continue; }
        const rec = {id: i >= 0 ? DB.daily[i].id : nid('d'), date:d, brandId:r.b.id, sold:+r.sold || 0, returned:+r.returned || 0, shipping:+r.shipping || 0};
        if (i >= 0) DB.daily[i] = rec; else DB.daily.push(rec); n++;
      }
      save(); dlg.close(); toast(`${fmtDay(d)} saved for ${n} brand${n === 1 ? '' : 's'}`); render();
    };
    dlg.querySelector(`#s-${DB.brands[0]?.id}-sold`)?.focus();
  };
  draw(); if (!dlg.open) dlg.showModal();
}

let toastT;
function toast(msg, undo){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  const s = document.createElement('span'); s.textContent = msg; t.append(s);
  if (undo){ const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Undo'; b.onclick = () => { undo(); save(); t.remove(); render(); }; t.append(b); }
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), undo ? 6000 : 2400);
}

function render(){
  // Drop selections that point at records which no longer exist (e.g. after a reset).
  if (UI.brand !== 'all' && !brand(UI.brand)) UI.brand = 'all';
  if (UI.qBrand && !brand(UI.qBrand)) UI.qBrand = '';
  if (!factory(UI.factory)) UI.factory = DB.factories[0]?.id;
  if (UI.section !== 'all' && !section(UI.section)) UI.section = 'all';
  const r = route();
  const pending = DB.brands.length - enteredToday().length;
  const officeLow = safeBalance('office') < DB.safes.office.low;
  const isSales = r.startsWith('sales');
  document.getElementById('nav').innerHTML = `<div class="nav-h">Modules</div>` + ['home','sales','production','marketing','safes'].map(k => {
    const on = k === 'sales' ? isSales : r === k;

    return h;
  }).join('');
  const [title, ar] = ROUTES[r];

  document.getElementById('crumb-sub').innerHTML = r === 'home' ? `${PERIOD_LABEL[UI.period]} · ${fmtDate(TODAY_S)}`
    : `<a href="#home">Overview</a> / ${isSales && r !== 'sales' ? '<a href="#sales">Online sales</a> / ' : ''}${title}`;
  document.getElementById('period').value = UI.period;
  const views = {home:viewHome, sales:viewSales, 'sales-brands':viewBrands, 'sales-collections':viewCollections, 'sales-invoices':viewInvoices, 'sales-statement':viewStatement, production:viewProduction, marketing:viewMarketing, safes:viewSafes};
  document.getElementById('view').innerHTML = views[r]();
}
function go(r, set){ Object.assign(UI, set || {}); saveUI(); ROUTE = ROUTES[r] ? r : 'home'; render(); window.scrollTo(0,0); }

document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  const el = e.target.closest('[data-act]');
  if (a) e.preventDefault();
  if (a && (!el || el.dataset.act === 'safe-link')){ if (el) { UI.safe = 'main'; } go(a.getAttribute('href').slice(1)); return; }
  if (!el) return;
  const {act, id, k, f, i, c, d} = el.dataset;
  const set = (o) => { Object.assign(UI, o); saveUI(); render(); };
  switch (act){
    case 'new': openChooser(); break;
    case 'form': openForm(f); break;
    case 'sheet': openSheet(d); break;
    case 'theme': { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('finance-hub-theme', root.dataset.theme); } catch {} break; }
    case 'reset': confirmReset(); break;
    case 'brand': set({brand:id}); break;
    case 'factory': set({factory:id}); break;
    case 'open-brand': go('sales-brands', {brand:id}); break;
    case 'sec': set({section:id}); break;
    case 'ptab': e.preventDefault(); set({prodTab:k}); break;
    case 'mflow': set({mktFlow:k}); break;
    case 'safe': set({safe:k}); break;
    case 'safe-link': UI.safe = 'main'; saveUI(); break;
    case 'alert': { const a = ALERTS[+i]; if (a) go(a.go, a.set); break; }
    case 'del': {
      const coll = DB[c], idx = coll.findIndex(x => x.id === id); if (idx < 0) break;
      const [gone] = coll.splice(idx, 1); save(); render();
      toast('Entry deleted', () => coll.splice(Math.min(idx, coll.length), 0, gone));
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const t = e.target; if (!t.closest || !t.closest('form') || !t.matches('input:not([type=file]):not([type=radio]):not([type=search]), select')) return;
  e.preventDefault(); runSubmit(t.closest('form'));
});
document.getElementById('period').addEventListener('change', e => { UI.period = e.target.value; saveUI(); render(); });
try { const th = localStorage.getItem('finance-hub-theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
render();
</script>
</body>
</html>
